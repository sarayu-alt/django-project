<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Mail Demo</title>
    <style>
        * {
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            background-image: 
                linear-gradient(rgba(30, 41, 59, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 41, 59, 0.3) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 32px;
            max-width: 500px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border: 1px solid rgba(16, 185, 129, 0.2);
            margin-bottom: 16px;
        }

        .status-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #10b981;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin: 0;
        }

        form {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 14px 16px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #ffffff;
            outline: none;
            font-family: inherit;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #4b5563;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            background: #111827;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-container {
            position: relative;
            margin-top: 32px;
        }

        input[type="submit"] {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        input[type="submit"]:hover {
            background: #2563eb;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
        }

        .loading input[type="submit"] {
            color: transparent;
            pointer-events: none;
            background: #1d4ed8;
        }

        .spinner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        .loading .spinner {
            display: block;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="dashboard-header">
    <div class="status-badge">Gmail SMTP Service Online</div>
    <h1>Django Mail </h1>
</div>

    
    <form id="dispatchForm" action="{% url 'send_mail' %}" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Recipient Name</label>
            <input id="name" name="name" type="text" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="sbj">Subject Line</label>
            <input id="sbj" name="subject" type="text" placeholder="Enter email intent" required>
        </div>

        <div class="form-group">
            <label for="msg">Message Body</label>
            
            <textarea id="msg" name="message" placeholder="Type your core content here..." required></textarea>
        </div>

        <div class="btn-container" id="submitWrapper">
            <input type="submit" value="Send Mail">
            <div class="spinner"></div>
        </div>
    </form>

    <script>
        
        document.getElementById('dispatchForm').addEventListener('submit', function() {
            document.getElementById('submitWrapper').classList.add('loading');
        });
    </script>
</body>
</html>
