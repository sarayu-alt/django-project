<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Mail Sender</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-cover bg-center bg-no-repeat min-h-screen font-sans flex items-center justify-center p-4 md:p-6 relative" 
      style="background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1600&auto=format&fit=crop');">

    <!-- Soft, Bright Overlay tinting the nature image to keep it clean and premium -->
    <div class="absolute inset-0 bg-white/40 backdrop-blur-xs z-0"></div>

    <!-- Centered Single-Column Form Wrapper Container -->
    <div class="max-w-xl w-full relative z-10 bg-sky-50/70 border border-sky-100/50 backdrop-blur-xl p-6 md:p-8 rounded-3xl shadow-2xl">
        
        <!-- Header Section -->
        <div class="flex items-center gap-3 mb-6 border-b border-sky-100 pb-4">
            <div class="w-10 h-10 rounded-xl bg-white border border-sky-200 text-sky-600 flex items-center justify-center shadow-xs">
                <i class="fa-regular fa-paper-plane text-base"></i>
            </div>
            <div>
                <h2 class="text-base font-extrabold tracking-wide text-slate-800 uppercase">Django Mail Sender</h2>
                <p class="text-[11px] text-sky-700 font-semibold tracking-wider">MVT Communication Core</p>
            </div>
        </div>

        <!-- Django Messages Success/Error Alert Popups -->
        {% if messages %}
            {% for message in messages %}
                <div class="p-3 mb-4 rounded-xl text-xs font-bold {% if 'success' in message.tags %}bg-emerald-50 border-emerald-200 text-emerald-700{% else %}bg-rose-50 border-rose-200 text-rose-700{% endif %} border shadow-xs">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Main Interactive Mail Form -->
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            
            <!-- Input 1: Sender Name Sign-off -->
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Sender Identifier</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-xs"><i class="fa-regular fa-user"></i></span>
                    <input type="text" name="name" required placeholder="e.g. Lead Administrator" class="w-full bg-white/80 border border-sky-200/60 rounded-xl py-2.5 pl-9 pr-3 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:bg-white shadow-xs transition-all">
                </div>
            </div>

            <!-- Input 2: Destination Email List -->
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Recipient Address Matrix</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-xs"><i class="fa-regular fa-envelope"></i></span>
                    <input type="text" name="recipients" required placeholder="admin@domain.com, client@node.io" class="w-full bg-white/80 border border-sky-200/60 rounded-xl py-2.5 pl-9 pr-3 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:bg-white shadow-xs transition-all">
                </div>
                <p class="text-[9px] text-sky-700 font-medium mt-1">Separate multiple email addresses using commas</p>
            </div>

            <!-- Input 3: Email Message Subject Line -->
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Subject Heading</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-xs"><i class="fa-regular fa-bookmark"></i></span>
                    <input type="text" name="subject" required placeholder="Enter transmission subject" class="w-full bg-white/80 border border-sky-200/60 rounded-xl py-2.5 pl-9 pr-3 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:bg-white shadow-xs transition-all">
                </div>
            </div>

            <!-- Input 4: Comprehensive Text Body -->
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Message Content String</label>
                <textarea name="message" rows="5" required placeholder="Compose text data block stream..." class="w-full bg-white/80 border border-sky-200/60 rounded-xl p-3.5 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:bg-white shadow-xs transition-all resize-none"></textarea>
            </div>

            <!-- Input 5: Optional File Attachment Node -->
            <div class="bg-white/60 border border-sky-200/40 p-2.5 rounded-xl flex items-center justify-between shadow-xs">
                <div class="flex flex-col">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Attachment File</span>
                    <span class="text-[9px] text-sky-700 font-medium">Optional file byte payload</span>
                </div>
                <label class="bg-white border border-sky-200 hover:border-sky-300 text-sky-700 text-xs px-3 py-1.5 rounded-lg font-bold cursor-pointer shadow-xs transition-colors">
                    <i class="fa-solid fa-paperclip mr-1"></i> Attach
                    <input type="file" id="form-file" name="attachment" class="hidden">
                </label>
            </div>

            <!-- Unique Neon Mint Action Trigger Button -->
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs uppercase tracking-widest py-3.5 px-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer active:scale-[0.99] mt-2">
                <i class="fa-solid fa-paper-plane text-[10px]"></i> Send Email
            </button>
        </form>

        <!-- Bottom Brand Stamp -->
        <div class="mt-6 pt-3 border-t border-sky-100 flex items-center justify-between text-xs text-sky-800/60 font-medium">
            <span>Django Mail System Integration</span>
            <i class="fa-brands fa-python text-base text-sky-600/40"></i>
        </div>
    </div>

    <!-- File Attachment Success Feedback Script -->
    <script>
        const formFile = document.getElementById('form-file');
        formFile.addEventListener('change', (e) => {
            const labelNode = formFile.parentElement;
            if(e.target.files.length > 0) {
                labelNode.innerHTML = `<i class="fa-solid fa-check text-emerald-600 mr-1"></i> Attached`;
                labelNode.classList.add('border-emerald-300', 'text-emerald-700');
            }
        });
    </script>
</body>
</html>
